# Factry Historian Module - operational settings
# These values are bundled in the module and not exposed in the Ignition UI.

# gRPC write deadline in seconds (createPoints timeout)
grpc.write.deadline.seconds=3

# How often the module checks the Factry connection, in milliseconds.
# Pauses store and forward while Factry is unreachable and resumes it when it is back.
status.cache.ms=30000

# How often the measurement cache asks Factry for this collector's changed measurements, in
# seconds: new, Paused and Deleted ones, so writes stop for a paused measurement and a deleted
# one is created again on the next store. Small: only what changed since the last answer.
measurement.cache.refresh.seconds=30

# How often the measurement cache reloads every measurement, collector and asset of the
# organisation, in seconds. Measurements made by hand or by other collectors show up in browse
# from this reload; a read by exact name finds them at once.
measurement.cache.full.refresh.seconds=600

# How long a read remembers that Factry has no measurement with a tag's name, in seconds.
# A read of a tag the cache does not know looks its exact name up in Factry once; a trend
# of a misspelt or deleted tag then asks again at most this often.
measurement.lookup.miss.seconds=60

# Page size for fetching measurements from Factry during cache refresh
# Larger values reduce the number of gRPC round-trips but increase per-request payload
measurement.cache.page.size=5000

# gRPC read deadline in seconds: history queries, each page of the measurement cache refresh,
# and the asset and asset property fetches (large on sites with many assets)
grpc.read.deadline.seconds=30

# gRPC deadline in seconds for the small calls: collectors, health and collector state
grpc.call.deadline.seconds=10

# How long a settings save or shutdown waits for running gRPC calls before it cancels them
grpc.shutdown.grace.seconds=3

# A write gets grpc.write.deadline.seconds plus this many milliseconds per point, so a full
# store and forward batch on a slow link gets more time than a single point. Measurement
# creation gets the same per measurement.
grpc.write.deadline.ms.per.point=1

# Ceiling on the write deadline in seconds, whatever the batch size
grpc.write.deadline.max.seconds=30

# Largest write message in bytes; a bigger flush is sent in several calls. Factry refuses a
# message over 64 MiB (its GRPC_MAX_MESSAGE_SIZE, counted after decompression). Values under
# 64 KiB are taken as 64 KiB. If Factry or a proxy in front of it refuses a write as too large,
# the module halves it and keeps the smaller size until the historian settings are saved.
grpc.write.max.message.bytes=4194304

# Link speed the write deadline allows for, in bytes per second of the uncompressed message:
# each write gets this much extra time for its size, within grpc.write.deadline.max.seconds.
# 262144 (about 2 Mbit/s) gives a 4 MiB message 16 s on top of the base deadline.
grpc.write.min.bytes.per.second=262144

# Send writes gzip-compressed: about 6 times fewer bytes on a slow link. Factry v8.2.3
# accepts it. If Factry answers that it has no gzip decompressor, the module logs a warning
# and sends writes uncompressed until the historian settings are saved or the gateway restarts.
grpc.write.gzip=true

# Most raw points one query reads from Factry, over all its pens together
# Raw reads page through Factry, so a long range over many pens has no other bound.
# Each point costs about 200 bytes of gateway heap while the query runs: the module
# holds it boxed in its own lists and Ignition buffers it again to build the dataset.
# So 500,000 points is about 100 MB per query, and several charts can query at once.
# When a range holds more, the read fails with an error instead of returning part of it.
# 500,000 covers a day of 1-second data for 5 pens.
query.raw.max.points=500000
