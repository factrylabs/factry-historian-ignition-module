# Field labels and descriptions for Factry Historian Settings
# These are displayed in the Gateway configuration UI

collectorUUID.Name=Collector ID
collectorUUID.Description=ID of the collector registered in Factry Historian

collectorToken.Name=Collector Token
collectorToken.Description=Collector token generated by Factry Historian, stored as a secret

hostOverride.Name=Host Override
hostOverride.Description=Host the gateway reaches Factry Historian on, when not the token's host

portOverride.Name=Port Override
portOverride.Description=gRPC port the gateway reaches Factry Historian on, when not the token's port

useTls.Name=Use TLS
useTls.Description=Encrypt the gRPC connection to Factry Historian

debugLogging.Name=Debug Logging
debugLogging.Description=Enable detailed debug logging
