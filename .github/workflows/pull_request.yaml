name: Pull request
run-name: Test and build ${{ github.head_ref }}

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run unit tests and build an unsigned module
        run: ./gradlew clean build -PskipSigning=true
